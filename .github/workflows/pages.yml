name: Deploy browser demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: web
      - name: Clear stale Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const staleDeployment = "22e8c5bda907d45dd48e6fff9e68edc8f0e395bd";
            try {
              await github.request(
                "POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pages_deployment_id: staleDeployment,
                },
              );
              core.info(`Canceled stale Pages deployment ${staleDeployment}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Stale Pages deployment ${staleDeployment} is already cleared`);
              } else {
                throw error;
              }
            }
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
