name: Platform install smoke check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-and-import:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Import vision and classifier dependencies
        run: python -c "import cv2, mediapipe, numpy, sklearn; print('Imports OK')"
      - name: Check camera diagnostic CLI
        run: python -m src.debug --help
